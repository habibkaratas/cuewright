name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: pip install build

      - name: Verify the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -oP '__version__ = "\K[^"]+' src/subforge/__init__.py)
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG does not match __version__ $VERSION" >&2
            exit 1
          fi

      - name: Build
        run: python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Draft a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*

# No PyPI publish step: the name "subforge" is taken on PyPI by an unrelated
# package. Distribution is via GitHub releases and `pip install git+https://...`.
# To publish, rename the project in pyproject.toml first, then add a job using
# pypa/gh-action-pypi-publish with `permissions: id-token: write`.
