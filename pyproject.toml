[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subforge"
dynamic = ["version"]
description = "Transcribe speech, translate it, and produce verified subtitles."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["subtitles", "srt", "whisper", "transcription", "translation", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "faster-whisper>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[project.scripts]
subforge = "subforge.cli:main"

[project.urls]
Homepage = "https://github.com/habibkaratas/subforge"
Issues = "https://github.com/habibkaratas/subforge/issues"

[tool.hatch.version]
path = "src/subforge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/subforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
