name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # The ffmpeg discovery logic is the most platform-sensitive part of
          # the project, so cover the other two OSes on one interpreter.
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  integration:
    name: end-to-end with ffmpeg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install
        run: pip install -e ".[dev]"

      - name: ffmpeg is discoverable
        run: python -c "from subforge.ffmpeg import ffmpeg_path, ffprobe_path; print(ffmpeg_path(), ffprobe_path())"

      - name: Build and burn a synthetic clip
        run: |
          ffmpeg -y -f lavfi -i testsrc=size=320x240:rate=10:duration=4 \
                 -f lavfi -i anullsrc=r=44100:cl=stereo -shortest clip.mp4
          printf '1\n00:00:00,000 --> 00:00:02,000\nhello world\n\n2\n00:00:02,000 --> 00:00:04,000\nsecond cue\n' > subs.srt
          subforge check subs.srt
          subforge burn clip.mp4 subs.srt out.mp4
          test -s out.mp4
