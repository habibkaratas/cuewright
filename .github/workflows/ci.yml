name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # The ffmpeg discovery logic is the most platform-sensitive part of
          # the project, so cover the other two OSes on one interpreter.
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  integration:
    name: end-to-end with ffmpeg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and a speech synthesiser
        # espeak-ng gives the transcription step some real speech to chew on.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Install
        run: pip install -e ".[dev]"

      - name: ffmpeg is discoverable
        run: python -c "from cuewright.ffmpeg import ffmpeg_path, ffprobe_path; print(ffmpeg_path(), ffprobe_path())"

      - name: Build and burn a synthetic clip
        run: |
          ffmpeg -y -f lavfi -i testsrc=size=320x240:rate=10:duration=4 \
                 -f lavfi -i anullsrc=r=44100:cl=stereo -shortest clip.mp4
          printf '1\n00:00:00,000 --> 00:00:02,000\nhello world\n\n2\n00:00:02,000 --> 00:00:04,000\nsecond cue\n' > subs.srt
          cuewright check subs.srt
          cuewright burn clip.mp4 subs.srt out.mp4
          test -s out.mp4

      - name: Enhance a noisy clip and refuse a mute one
        run: |
          ffmpeg -y -f lavfi -i "sine=frequency=300:sample_rate=8000:duration=3" \
                 -f lavfi -i "anoisesrc=color=pink:amplitude=0.05:sample_rate=8000:duration=3" \
                 -filter_complex amix=inputs=2 noisy.wav
          cuewright enhance noisy.wav --format flac
          test -s noisy.audio.wav
          test -s noisy.clean.flac
          cuewright enhance noisy.wav --profile listen --tempo 0.8 --clean-only
          test -s noisy.listen.wav
          if cuewright enhance noisy.wav --profile listen --denoise 10; then
            echo "a transcribe-only flag must be refused for the listen profile"; exit 1
          fi
          cuewright spectrogram noisy.wav --start 1 --duration 1
          test -s noisy.1s-2s.spectrogram.png
          ffmpeg -y -f lavfi -i testsrc=size=64x64:rate=5:duration=1 mute.mp4
          if cuewright enhance mute.mp4; then echo "a mute clip must fail"; exit 1; fi

      - name: Transcribe real speech end to end
        # The flagship command once shipped broken because nothing here ever
        # ran it: the unit tests do not touch the model and the burn test does
        # not need one. Downloading `tiny` is a small price for covering the
        # whole path — decode, transcribe, write SRT, write segments.json.
        run: |
          espeak-ng -w speech.wav -s 130 \
            "The quick brown fox jumps over the lazy dog. \
             Flat glass is one of the most important materials in construction."
          cuewright transcribe speech.wav --model tiny --language en --tag en
          test -s speech.en.srt
          test -s speech.en.segments.json
          cuewright check speech.en.srt
          cuewright verify speech.en.segments.json || true
          python - <<'PY'
          from cuewright.segments import SegmentFile
          from cuewright.srt import read_srt
          transcript = SegmentFile.load("speech.en.segments.json")
          assert transcript.segments, "transcription produced no segments"
          assert read_srt("speech.en.srt"), "no cues were written"
          print(f"{len(transcript.segments)} segments, language={transcript.language}")
          PY
